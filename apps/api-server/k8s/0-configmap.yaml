apiVersion: v1
kind: ConfigMap
metadata:
  name: apiserver-config
data:
  REDIS_URL: "redis://redis:6379"
  REDIS_HOST: "redis.torq.svc.cluster.local"
  REDIS_PORT: "6379"
  BETTER_AUTH_URL: "http://localhost:4000"
  APP_EMAIL: "onboarding@resend.dev"
  LOG_LEVEL: "info"
  NODE_ENV: "development"
  MULTI_AUTH_ENABLED: "true"


apiVersion: apps/v1
kind: Deployment
metadata:
  name: torq-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: torq-operator
  template:
    metadata:
      labels:
        app: torq-operator
    spec:
      serviceAccountName: torq-operator
      containers:
        - name: torq-operator
          image: fizanmuhammedfaisal/torq-operator
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: torq-operator-service
spec:
  selector:
    app: torq-operator-service
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP

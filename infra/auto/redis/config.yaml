apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: torq
  labels:
    app: redis
data:
  redis.conf: |
    # Network
    bind 0.0.0.0
    protected-mode no
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300

    # General
    daemonize no
    loglevel notice
    databases 16

    # Memory
    maxmemory 256mb
    maxmemory-policy noeviction

    # Persistence (AOF only, no RDB)
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    save ""

    # Slow log
    slowlog-log-slower-than 10000
    slowlog-max-len 128

    # Latency
    latency-monitor-threshold 100

    # Clients
    maxclients 100
